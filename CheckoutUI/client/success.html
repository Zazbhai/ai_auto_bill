<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111827;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            opacity: 0;
            transform: scale(0.5);
            animation: containerAppear 0.7s forwards 0.1s;
        }

        .container.fade-out {
            animation: fadeOut 1s forwards;
        }

        .check-circle {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 4px solid #3B82F6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check {
            stroke: #3B82F6;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transform: scale(0);
            animation: checkAppear 0.7s forwards 0.5s;
        }

        .success-text {
            color: white;
            font-size: 24px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(16px);
            animation: textAppear 0.7s forwards 0.8s;
        }

        .background-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            opacity: 0;
            animation: glowAppear 1s forwards 0.3s;
        }

        .background-glow.fade-out {
            animation: fadeOut 1s forwards;
        }

        @keyframes containerAppear {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes checkAppear {
            to {
                transform: scale(1);
            }
        }

        @keyframes textAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glowAppear {
            to {
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <div class="check-circle">
            <svg class="check" width="48" height="48" viewBox="0 0 24 24">
                <path d="M20 6L9 17L4 12"></path>
            </svg>
        </div>
        <div class="success-text">Payment Successful</div>
    </div>

    <script>
        // Add fade-out animation after 4 seconds
        setTimeout(() => {
            document.querySelector('.container').classList.add('fade-out');
            document.querySelector('.background-glow').classList.add('fade-out');
        }, 3000);

        // Redirect after 5 seconds
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 3800);
    </script>
</body>
</html>
